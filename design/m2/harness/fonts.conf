<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 出設計稿用的字型設定（browser.mjs 用 FONTCONFIG_FILE 指到這裡，只影響出圖的瀏覽器，不改電腦桌面的設定）：
     先照系統原本的設定，再把字的反鋸齒改成灰階（不要彩色的次像素）。
     2026-10-08 換新電腦：系統開了 10-sub-pixel-rgb.conf，字的邊緣有藍、橘色的邊；舊電腦是灰階。改成灰階以後跟舊電腦拍的逐點一樣。 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><edit name="rgba" mode="assign"><const>none</const></edit></match>
  <match target="font"><edit name="rgba" mode="assign"><const>none</const></edit></match>
</fontconfig>
