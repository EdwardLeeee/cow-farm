name: CI

# main 只收必要檢查全綠的 PR。分支保護的必要檢查：backend、app（名稱要和下面的 job 一字不差）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支或 PR 有新的 push，就取消還在跑的舊執行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 測試用這個帳號建立 cowfarm_test_* 資料庫，每次重建（backend/tests/conftest.py）。
      COWFARM_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      # 檢查工具釘版本，本機和 CI 的結果才會一樣。
      - run: pip install -r backend/requirements.txt ruff==0.15.2 shellcheck-py==0.11.0.1 pip-audit
      # 整個 repo 的 Python；不檢查的範圍與原因寫在 ruff.toml。
      # ruff format 還沒加：54 個檔案還沒排版，cow-back 開工的第一個 PR 一次排好再加進來。
      - run: ruff check .
      # 所有進 git 的 shell 腳本，新的腳本不用改這份清單也會被檢查。
      - run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - run: pip-audit -r backend/requirements.txt
      # 經濟引擎的單元測試（47 個，約 15 秒）。
      - run: python -m unittest
        working-directory: docs/research/economy
      # 伺服器測試：存檔回復、經濟情境、協定、重啟回復（約 4 分鐘）。
      - run: python -m pytest -q
        working-directory: backend

  app:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Flutter 版本讀 app/pubspec.yaml 的 environment.flutter（3.47.5），本機與 CI 同一版。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter --version
      - run: flutter pub get
        working-directory: app
      # 排版：行寬寫在 app/analysis_options.yaml（120）。沒排好就失敗；本機在 app/ 跑 `dart format lib test` 排好再推。
      # 要在 pub get 之後跑：analysis_options.yaml 的 include 要先解析得到，不然 dart format 讀不到行寬、退回 80。
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
