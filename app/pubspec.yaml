name: cowfarm
description: "牛市牧場 M1 連線原型（只用色塊和文字，不是正式畫面）"
publish_to: 'none'

# 顯示版本 0.1.0、建置號 1。
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  # 系統元件（輸入框選單、日期）跟著 app 的語言（D25：繁中、英文、泰文）。
  flutter_localizations:
    sdk: flutter
  # 狀態管理：ChangeNotifier + provider（簡單做法）。
  provider: ^6.1.5
  # HTTP 與 WebSocket。
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  # request_id 用 UUID v4。
  uuid: ^4.5.1
  # 登入 token：手機存 Keychain／Keystore（T1：不用 shared_preferences）。
  flutter_secure_storage: ^11.2.0
  # 網頁版把 token 存在瀏覽器 localStorage（區網 http 不是安全環境，無法用 WebCrypto）。
  web: ^1.1.0
  # 偏好設定（語言、漲跌顏色）；不是帳，也不放 token（T1）。
  shared_preferences: ^2.5.0
  # 牛、圖示、場景是 cow-ui 匯出的 SVG，執行時讀（T3；ceo 2026-10-02：不在建置時轉換）。
  flutter_svg: ^2.3.0
  # 牧場場景（D4、T3）：牛走動（A-11）、轉身（A-07）。版本同 T2 的測試版。
  flame: 1.38.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # test/cow_assets_test.dart 算素材的 SHA-256
  crypto: ^3.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # cow-ui 的 design/m2/harness/assetexport.mjs 產生的素材，不要手改（test/cow_assets_test.dart 檢查）。
    # 執行時直接讀 SVG：Flutter 的 asset transformer 每個檔開一個行程，600 張在這台的記憶體上限內跑不動。
    - assets/cows/svg/
    - assets/cows/cows.json
    - assets/ui/icons/
    - assets/ui/scenes/
    - assets/ui/parts/
    - assets/ui/ui.json
    # 內建字型的授權全文（OFL 1.1），放進第三方授權頁（theme/app_theme.dart 的 registerFontLicenses）。
    - assets/fonts/OFL-NotoSansTC.txt
    - assets/fonts/OFL-NotoSansThai.txt
  # 字型（T3，ceo 2026-10-02）：Noto Sans TC 可變字型完整版（google/fonts，2.004-H2），泰文接 Noto Sans Thai 可變字型（2.002）。
  # 一個檔包含所有粗細（100–900），粗細用 theme/tokens.dart 的 AppText 設。
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-VF.ttf
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-VF.ttf
